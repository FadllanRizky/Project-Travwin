      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/mcr_kereta_service
    restart: unless-stopped

  whoosh-service:
    build: ./whoosh-service
    container_name: travelku-whoosh-service
    environment:
      <<: *db-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/mcr_whoosh_service
