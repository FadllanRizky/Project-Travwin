name: travelku

# Common DB connection variables for every Spring Boot microservice.
# Host PostgreSQL (Windows service) is reached via host.docker.internal.
x-db-env: &db-env
  SPRING_DATASOURCE_USERNAME: ${DB_USER:-mburmin}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mburmin123}
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

services:
  api-gateway:
    build: ./api-gateway
    container_name: travelku-api-gateway
    environment:
      GATEWAY_HOSTS: auth=auth-service,users=user-service,hotels=hotel-service,flights=pesawat-service,trains=kereta-service,whoosh=whoosh-service,travel=travel-service,rentals=rental-service,airport-transfers=airport-transfer-service,bookings=booking-service,payments=payment-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: travelku-auth-service
    environment:
      <<: *db-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/mcr_auth_service
    restart: unless-stopped

  user-service:
    build: ./user-service
    container_name: travelku-user-service
    environment:
      <<: *db-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/mcr_user_service
    restart: unless-stopped

  hotel-service:
    build: ./hotel-service
    container_name: travelku-hotel-service
